name: CI
on:
  push:
    branches: ["main"]
    paths-ignore: ["*.md", "LICENSE-*"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["*.md", "LICENSE-*"]
env:
  CARGO_TERM_COLOR: always
  # Cargo.lock is not tracked; resolve dependencies against the declared MSRV.
  CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Continuous Integration (${{ matrix.rust }}, ${{ matrix.hpke }}, ${{ matrix.stream.name }})
    runs-on: ubuntu-latest
    env:
      NSS_DIR: ${{ github.workspace }}/nss
    strategy:
      fail-fast: false
      matrix:
        hpke:
          - nss
          - rust-hpke
        rust:
          - 1.86.0 # MSRV
          - stable
        stream:
          - name: stream-off
            workspace_features: client,server
            client_features: client
            server_features: server
          - name: stream-on
            workspace_features: client,server,stream
            client_features: client,stream
            server_features: server,stream
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Build Prerequisites for NSS
        if: matrix.hpke == 'nss'
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            coreutils \
            curl \
            git \
            gyp \
            libclang-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            mercurial \
            ninja-build \
            pkg-config \
            ssh \
            zlib1g-dev \
            --no-install-recommends
          echo RUSTFLAGS="-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"


      - name: Fetch NSS and NSPR
        if: matrix.hpke == 'nss'
        run: |
          hg clone https://hg.mozilla.org/projects/nspr "$NSS_DIR"/../nspr
          git clone --depth 1 https://github.com/nss-dev/nss "$NSS_DIR"
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/dist/Debug/lib" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo +${{ matrix.rust }} build --tests --no-default-features --features ${{ matrix.hpke }},${{ matrix.stream.workspace_features }}

      - name: Run Tests
        run: |
          cargo +${{ matrix.rust }} test --no-default-features --features ${{ matrix.hpke }},${{ matrix.stream.workspace_features }}

      - name: Check isolated OHTTP feature sets
        run: |
          cargo +${{ matrix.rust }} check -p ohttp --no-default-features --features ${{ matrix.hpke }},${{ matrix.stream.client_features }}
          cargo +${{ matrix.rust }} check -p ohttp --no-default-features --features ${{ matrix.hpke }},${{ matrix.stream.server_features }}

      - name: Check formatting
        if: ${{ success() || failure() }}
        run: |
          cargo +${{ matrix.rust }} fmt --all -- --check --config imports_granularity=Crate

      - name: Clippy
        if: ${{ success() || failure() }}
        run: |
          cargo +${{ matrix.rust }} clippy --tests --no-default-features --features ${{ matrix.hpke }},${{ matrix.stream.workspace_features }}
