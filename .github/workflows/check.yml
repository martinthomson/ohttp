name: CI
on:
  push:
    branches: ["main"]
    paths-ignore: ["*.md", "LICENSE-*"]
  pull_request:
    branches: ["main"]
    paths-ignore: ["*.md", "LICENSE-*"]

jobs:
  check:
    name: Continuous Integration (${{ matrix.rust }}, ${{ matrix.hpke }}, ${{ matrix.stream.name }})
    runs-on: ubuntu-latest
    env:
      NSS_DIR: ${{ github.workspace }}/nss
      CARGO_TERM_COLOR: always
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      RUST_BACKTRACE: 1
    strategy:
      fail-fast: false
      matrix:
        hpke:
          - nss
          - rust-hpke
        rust:
          - 1.86.0 # MSRV
          - stable
        stream:
          - name: stream-off
            features: ""
          - name: stream-on
            features: ",stream"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Build Prerequisites for NSS
        if: matrix.hpke == 'nss'
        run: |
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            coreutils \
            curl \
            git \
            gyp \
            libclang-dev \
            libssl-dev \
            lld \
            llvm \
            make \
            mercurial \
            ninja-build \
            pkg-config \
            ssh \
            zlib1g-dev \
            --no-install-recommends
          echo RUSTFLAGS="-C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"


      - name: Fetch NSS and NSPR
        if: matrix.hpke == 'nss'
        run: |
          hg clone https://hg.mozilla.org/projects/nspr "$NSS_DIR"/../nspr
          git clone --depth 1 https://github.com/nss-dev/nss "$NSS_DIR"
          echo "LD_LIBRARY_PATH=${{ github.workspace }}/dist/Debug/lib" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cargo +${{ matrix.rust }} build --tests --no-default-features --features client,server,${{ matrix.hpke }}${{ matrix.stream.features }}

      - name: Run Tests
        run: |
          cargo +${{ matrix.rust }} test --no-default-features --features client,server,${{ matrix.hpke }}${{ matrix.stream.features }}

      - name: Check isolated OHTTP feature sets
        run: |
          cargo +${{ matrix.rust }} check -p ohttp --no-default-features --features ${{ matrix.hpke }}${{ matrix.stream.features }},client
          cargo +${{ matrix.rust }} check -p ohttp --no-default-features --features ${{ matrix.hpke }}${{ matrix.stream.features }},server

      - name: Check formatting
        if: ${{ success() || failure() }}
        run: |
          cargo +${{ matrix.rust }} fmt --all -- --check --config imports_granularity=Crate

      - name: Clippy
        if: ${{ success() || failure() }}
        run: |
          cargo +${{ matrix.rust }} clippy --tests --no-default-features --features client,server,${{ matrix.hpke }}${{ matrix.stream.features }}
